name: Sons Mágicos - APK da TV

on:
  push:
    paths:
      - "ipa-kids/**"
      - ".github/workflows/sons-magicos-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner do GitHub já vem com o Android SDK; só garantimos a plataforma usada.
      - name: Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Opcional: guarde sua chave em Settings > Secrets > Actions como SONS_KEYSTORE_BASE64
      # (base64 do arquivo dados/chave/sons-magicos.keystore do servidor) para o APK
      # do GitHub instalar por cima do APK gerado no servidor.
      - name: Chave de assinatura
        env:
          CHAVE: ${{ secrets.SONS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/sons.keystore"
            echo "SONS_KEYSTORE=$RUNNER_TEMP/sons.keystore" >> "$GITHUB_ENV"
          else
            echo "Sem chave fixa: APK assinado com chave de debug."
          fi

      - name: Gerar APK
        run: gradle -p ipa-kids/android --no-daemon assembleRelease

      - name: Renomear
        run: cp ipa-kids/android/app/build/outputs/apk/release/app-release.apk sons-magicos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sons-magicos-apk
          path: sons-magicos.apk
          retention-days: 90
