name: Sons Mágicos - APK da TV

on:
  push:
    paths:
      - "ipa-kids/**"
      - ".github/workflows/sons-magicos-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Gerar APK
        run: gradle -p ipa-kids/android --no-daemon assembleRelease

      - name: Renomear
        run: cp ipa-kids/android/app/build/outputs/apk/release/app-release.apk sons-magicos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sons-magicos-apk
          path: sons-magicos.apk
          retention-days: 90
