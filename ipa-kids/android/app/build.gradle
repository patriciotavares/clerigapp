plugins {
    id 'com.android.application'
}

android {
    namespace 'br.casa.sonsmagicos'
    compileSdk 34

    defaultConfig {
        applicationId 'br.casa.sonsmagicos'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Chave fixa: assim cada nova versão instala por cima da anterior na TV.
    signingConfigs {
        casa {
            storeFile file('../sons-magicos.keystore')
            storePassword 'sonsmagicos'
            keyAlias 'sonsmagicos'
            keyPassword 'sonsmagicos'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.casa
        }
        debug {
            signingConfig signingConfigs.casa
        }
    }

    // O app web (pasta ipa-kids/web) vai inteiro dentro do APK: funciona mesmo sem internet.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
