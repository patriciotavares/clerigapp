plugins {
    id 'com.android.application'
}

android {
    namespace 'br.casa.sonsmagicos'
    compileSdk 34

    defaultConfig {
        applicationId 'br.casa.sonsmagicos'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Chave de assinatura: com uma chave fixa, cada nova versão instala por cima da anterior na TV.
    // Ela NÃO fica no repositório. Informe o caminho em SONS_KEYSTORE (o Docker do servidor cria uma
    // sozinho em dados/chave/). Sem chave, o APK sai com a chave de debug padrão.
    def chave = System.getenv('SONS_KEYSTORE') ? file(System.getenv('SONS_KEYSTORE')) : null
    def senha = System.getenv('SONS_KEYSTORE_SENHA') ?: 'sonsmagicos'

    signingConfigs {
        casa {
            if (chave != null && chave.exists()) {
                storeFile chave
                storePassword senha
                keyAlias 'sonsmagicos'
                keyPassword senha
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (chave != null && chave.exists()) ? signingConfigs.casa : signingConfigs.debug
        }
    }

    // O app web (pasta ipa-kids/web) vai inteiro dentro do APK: funciona mesmo sem internet.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
